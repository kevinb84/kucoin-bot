<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuCoin AI Trader v7</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }
        header {
            background: linear-gradient(135deg, #1a1f2e 0%, #2d3748 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-running { background: #10b981; color: white; }
        .status-stopped { background: #ef4444; color: white; }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .card {
            background: #1a1f2e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .card-title {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .metric {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .metric-small {
            font-size: 1.2rem;
        }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }

        /* Chart Container */
        .chart-container {
            height: 300px;
            position: relative;
        }

        /* Log Feed */
        .log-feed {
            height: 200px;
            overflow-y: auto;
            background: #0f1419;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.75rem;
        }
        .log-entry { margin-bottom: 3px; }

        /* Scanner Table */
        .scanner-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .scanner-table th {
            text-align: left;
            padding: 8px;
            background: #2d3748;
            color: #9ca3af;
        }
        .scanner-table td {
            padding: 8px;
            border-bottom: 1px solid #2d3748;
        }
        .score-bar {
            height: 4px;
            background: #2d3748;
            border-radius: 2px;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
        }
        .btn-stop {
            background: linear-gradient(90deg, #ef4444, #dc2626);
            color: white;
        }
        .btn:hover { transform: translateY(-2px); }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.2rem; }
            .metric { font-size: 1.4rem; }
            .chart-container { height: 200px; }
            .scanner-table { font-size: 0.7rem; }
            header { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>KuCoin AI Trader v7</h1>
                <p style="font-size: 0.8rem; color: #9ca3af;">Elite Execution Engine</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="statusBadge" class="status-badge status-stopped">STOPPED</span>
                <button id="startBtn" class="btn btn-start">START</button>
                <button id="stopBtn" class="btn btn-stop" style="display: none;">STOP</button>
            </div>
        </header>

        <!-- Key Metrics -->
        <div class="grid">
            <div class="card">
                <div class="card-title">Balance</div>
                <div class="metric" id="balance">$45.00</div>
            </div>
            <div class="card">
                <div class="card-title">Win Rate</div>
                <div class="metric" id="winRate">0%</div>
            </div>
            <div class="card">
                <div class="card-title">Total PnL</div>
                <div class="metric" id="totalPnl">$0.00</div>
            </div>
            <div class="card">
                <div class="card-title">Active Positions</div>
                <div class="metric" id="activePositions">0/3</div>
            </div>
        </div>

        <!-- Chart & Scanner -->
        <div class="grid">
            <div class="card" style="grid-column: span 2;">
                <div class="card-title">Price Chart</div>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-title">Top Scanner Results</div>
                <table class="scanner-table">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Score</th>
                            <th>Signal</th>
                        </tr>
                    </thead>
                    <tbody id="scannerBody">
                        <tr><td colspan="3" style="text-align: center;">Scanning...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- AI Learning Summary -->
        <div class="card">
            <div class="card-title">AI Intelligence</div>
            <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                <div>
                    <div class="card-title">Top Strategies</div>
                    <div id="topStrategies">-</div>
                </div>
                <div>
                    <div class="card-title">Preferred Symbols</div>
                    <div id="preferredSymbols">-</div>
                </div>
                <div>
                    <div class="card-title">Current Regime</div>
                    <div id="currentRegime">-</div>
                </div>
            </div>
        </div>

        <!-- Log Feed -->
        <div class="card">
            <div class="card-title">Live Log</div>
            <div class="log-feed" id="logFeed"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        let chart;

        // Initialize Chart
        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Price',
                        data: [],
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: {
                            grid: { color: '#2d3748' },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });
        }

        // Update UI from state
        function updateUI(state) {
            // Status
            const statusBadge = document.getElementById('statusBadge');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            if (state.is_running) {
                statusBadge.textContent = 'RUNNING';
                statusBadge.className = 'status-badge status-running';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
            } else {
                statusBadge.textContent = 'STOPPED';
                statusBadge.className = 'status-badge status-stopped';
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
            }

            // Metrics
            const compounding = state.compounding || {};
            document.getElementById('balance').textContent = `$${compounding.current_balance || 45.00}`;

            const perf = state.performance || {};
            const wr = perf.total_trades > 0 ? ((perf.winning_trades / perf.total_trades) * 100).toFixed(1) : 0;
            const winRateEl = document.getElementById('winRate');
            winRateEl.textContent = `${wr}%`;
            winRateEl.className = `metric ${wr >= 50 ? 'positive' : 'negative'}`;

            const pnl = perf.total_pnl || 0;
            const pnlEl = document.getElementById('totalPnl');
            pnlEl.textContent = `$${pnl.toFixed(2)}`;
            pnlEl.className = `metric ${pnl >= 0 ? 'positive' : 'negative'}`;

            const posCount = state.positions ? state.positions.length : 0;
            document.getElementById('activePositions').textContent = `${posCount}/3`;

            // Chart
            if (state.candles && state.candles.length > 0) {
                const labels = state.candles.map(c => new Date(c.time).toLocaleTimeString());
                const prices = state.candles.map(c => c.close);
                chart.data.labels = labels;
                chart.data.datasets[0].data = prices;
                chart.update('none');
            }

            // Scanner
            const scannerResults = state.scanner_results || [];
            const top5 = scannerResults.slice(0, 5);
            const scannerBody = document.getElementById('scannerBody');
            if (top5.length > 0) {
                scannerBody.innerHTML = top5.map(s => `
                    <tr>
                        <td>${s.symbol}</td>
                        <td>
                            <div class="score-bar">
                                <div class="score-fill" style="width: ${s.score}%"></div>
                            </div>
                            ${s.score}
                        </td>
                        <td style="color: ${s.signal === 'buy' ? '#10b981' : s.signal === 'sell' ? '#ef4444' : '#9ca3af'}">
                            ${s.signal.toUpperCase()}
                        </td>
                    </tr>
                `).join('');
            }

            // AI Learning
            const ai = state.ai_learning || {};
            document.getElementById('topStrategies').textContent = (ai.top_strategies || []).join(', ') || '-';
            document.getElementById('preferredSymbols').textContent = (ai.preferred_symbols || []).join(', ') || '-';
            document.getElementById('currentRegime').textContent = ai.current_regime || '-';
        }

        // Socket events
        socket.on('connect', () => {
            console.log('Connected');
        });

        socket.on('state', (state) => {
            updateUI(state);
        });

        socket.on('log', (data) => {
            const logFeed = document.getElementById('logFeed');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = data.line;
            logFeed.appendChild(entry);
            logFeed.scrollTop = logFeed.scrollHeight;
        });

        // Button handlers
        document.getElementById('startBtn').addEventListener('click', () => {
            socket.emit('start_bot');
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            socket.emit('stop_bot');
        });

        // Init
        initChart();
    </script>
</body>
</html>
