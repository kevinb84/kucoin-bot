# KuCoin Advanced AI Scanner Bot v2
# Scans ALL futures pairs, 100-point scoring, fee-aware trading
# Balance: ~$45 | Leverage: 10x | Risk: 3% per trade
# Only trades when score >= 70 AND expected profit > 3x fees

# ===== API =====
api_key: ""
api_secret: ""
api_passphrase: ""

# ===== Trading - 5 MINUTE CHART =====
timeframe: "5m"
check_interval: 12        # Scanner runs every 12 seconds
leverage: 10               # Fixed at 10x (skip pairs that don't support it)

# ===== AI Scanner Settings =====
scanner_enabled: true
scanner_min_score: 70      # Only trade pairs with score >= 70/100
scanner_max_open: 3        # Max 3 concurrent positions
risk_per_trade: 3.0        # 3% of balance risked per trade

# ===== Risk Management =====
# Dynamic position sizing based on stop-loss distance
# Position Size = (Balance × Risk%) ÷ SL Distance
stop_loss_base: 0.35        # Base SL
stop_loss_volatile: 0.7     # High volatility SL
take_profit_percent: 0.8     # Base TP increased
take_profit_dynamic: true    # Enable dynamic TP
tp_strong_trend: 1.2         # Strong trend TP
tp_normal: 0.8               # Normal TP
trailing_stop: true
trailing_stop_distance: 0.25      # Normal volatility
trailing_stop_volatile: 0.5       # High volatility
max_daily_loss: 7.0        # Stop after 7% daily loss (protect capital)
max_drawdown: 25.0         # Hard stop at 25% drawdown
max_hold_time_minutes: 20  # Base hold time
max_hold_strong_trend: 60  # Strong trend hold time

# ===== Strategy - 5-min optimized =====
ema_fast: 7
ema_slow: 21
ema_signal_threshold: 0.1
min_signal_strength: 7
rsi_period: 14
rsi_overbought: 65
rsi_oversold: 35
rsi_extreme_overbought: 80
rsi_extreme_oversold: 20

# ===== Filters =====
confirm_with_higher_tf: true
volume_threshold: 1.2
exit_on_opposite_signal: true

# ===== Self-Learning =====
learning_enabled: true
optimization_interval: 30
min_trades_for_optimization: 10
parameter_auto_tune: true
performance_tracking: true

# ===== ML =====
ml_enabled: false

# ===== Market Regime =====
regime_detection: true
volatility_lookback: 30
trend_strength_threshold: 0.4

# ===== Logging =====
log_level: "INFO"
log_file: "trading_bot.log"
log_trades_to_file: true
performance_report_interval: 300

# ===== Database =====
journal_db_path: "trading_journal.db"
