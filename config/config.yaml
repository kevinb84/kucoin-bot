# KuCoin Smart Scanner Bot - Finds best opportunities across ALL futures pairs
# Scans 20 pairs, only trades when confidence >= 7/10
# Balance: ~$45 | Leverage: 10x | $20 margin = $200 position
# Math: $200 position × 0.5% move = $1.00 profit per win

# ===== API =====
api_key: ""
api_secret: ""
api_passphrase: ""

# ===== Trading - 5 MINUTE CHART =====
symbol: "XBTUSDTM"       # Fallback symbol if scanner finds nothing
timeframe: "5m"
check_interval: 15        # Scanner runs every 15 seconds
leverage: 10

# ===== Scanner Settings =====
scanner_enabled: true
scanner_min_score: 7      # Only trade pairs with score >= 7/10
scanner_max_open: 1       # Max 1 open position at a time
scanner_interval: 60      # Re-scan all pairs every 60 seconds

# ===== Risk Management =====
# $20 margin × 10x = $200 position
# TP: 0.5% = $1.00 profit per win
# SL: 0.3% = $0.60 max loss  → 1.67:1 reward/risk
max_position_size: 25
risk_per_trade: 20.0
stop_loss_percent: 0.3    # 0.3% SL = $0.60 max loss
take_profit_percent: 0.5  # 0.5% TP = $1.00 profit per win
trailing_stop: true
trailing_stop_distance: 0.2
max_daily_loss: 15.0
max_drawdown: 20.0
max_hold_time_minutes: 15  # Exit after 15 min if no TP/SL

# ===== Strategy - 5-min optimized =====
ema_fast: 7
ema_slow: 21
ema_signal_threshold: 0.1
min_signal_strength: 7     # Only trade 7+ strength signals
rsi_period: 14
rsi_overbought: 65
rsi_oversold: 35
rsi_extreme_overbought: 80
rsi_extreme_oversold: 20

# ===== Filters =====
confirm_with_higher_tf: true
volume_threshold: 1.2
exit_on_opposite_signal: true

# ===== Multi-Pair (managed by scanner) =====
multi_pair_trading:
  enabled: true
  pairs:
    - "XBTUSDTM"
    - "ETHUSDTM"
    - "SOLUSDTM"
    - "XRPUSDTM"
    - "DOGEUSDTM"
    - "ADAUSDTM"
    - "AVAXUSDTM"
    - "LINKUSDTM"
    - "BNBUSDTM"
    - "LTCUSDTM"
    - "DOTUSDTM"
    - "BCHUHDTM"
    - "UNIUSDTM"
    - "ATOMUSDTM"
    - "NEARUSDTM"
    - "MATICUSDTM"
    - "AAVEUSDTM"
    - "FILUSDTM"
    - "TRXUSDTM"
    - "ETCUSDTM"

# ===== Self-Learning =====
learning_enabled: true
optimization_interval: 30
min_trades_for_optimization: 10
parameter_auto_tune: true
performance_tracking: true

# ===== ML =====
ml_enabled: false

# ===== Market Regime =====
regime_detection: true
volatility_lookback: 30
trend_strength_threshold: 0.4

# ===== Logging =====
log_level: "INFO"
log_file: "trading_bot.log"
log_trades_to_file: true
performance_report_interval: 300

# ===== Database =====
journal_db_path: "trading_journal.db"
