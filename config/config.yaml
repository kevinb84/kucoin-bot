# KuCoin Trading Bot - Optimized for $3+ profit per trade
# Balance: ~$45 | Leverage: 50x | Target: $3-5 per winning trade

# ===== API (set via Railway env vars) =====
api_key: ""
api_secret: ""
api_passphrase: ""

# ===== Trading =====
symbol: "XBTUSDTM"
timeframe: "5m"
check_interval: 10
leverage: 50

# ===== Risk Management - Optimized for $3+ per trade =====
# Math: $45 × 33% = $15 margin × 10x = $150 position × 2% TP = $3.00 profit
max_position_size: 30        # $30 max margin per trade
risk_per_trade: 30.0         # 30% of balance per trade ($45 × 30% = $13.50 margin = $675 position @ 50x)
stop_loss_percent: 0.3       # 0.3% stop loss = $0.27 loss max (tighter)
take_profit_percent: 1.5     # 1.5% take profit = $4.50-$10.00 profit per trade
trailing_stop: true
trailing_stop_distance: 0.2  # Trail at 0.2%
max_daily_loss: 10.0         # Max 10% daily loss ($4.50)
max_drawdown: 15.0           # Stop at 15% drawdown ($6.75)

# ===== Strategy =====
ema_fast: 7
ema_slow: 15
ema_signal_threshold: 0.15
min_signal_strength: 5
rsi_period: 14
rsi_overbought: 60
rsi_oversold: 40
rsi_extreme_overbought: 75
rsi_extreme_oversold: 25

# ===== Filters =====
confirm_with_higher_tf: true
volume_threshold: 1.3
exit_on_opposite_signal: true
max_hold_time_minutes: 60    # Give 2% target time to be reached

# ===== Multi-Pair Trading - ENABLED =====
multi_pair_trading:
  enabled: true
  pairs:
    - "XBTUSDTM"
    - "SIRENUSDTM"

# ===== Self-Learning =====
learning_enabled: true
optimization_interval: 20
min_trades_for_optimization: 10
parameter_auto_tune: true
performance_tracking: true

# ===== ML =====
ml_enabled: true
ml_model_type: "random_forest"
ml_feature_count: 10
ml_retrain_interval: 20
ml_confidence_threshold: 0.55

# ===== Market Regime =====
regime_detection: true
volatility_lookback: 30
trend_strength_threshold: 0.4

# ===== Logging =====
log_level: "INFO"
log_file: "trading_bot.log"
log_trades_to_file: true
performance_report_interval: 900

# ===== Database =====
journal_db_path: "trading_journal.db"
