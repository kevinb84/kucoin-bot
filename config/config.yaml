# KuCoin Trading Bot - Dual Pair Scalping
# Primary: XBTUSDTM (BTC) + SIRENUSDTM (SIREN small cap)

# ===== API (set via Railway env vars) =====
api_key: ""
api_secret: ""
api_passphrase: ""

# ===== Trading =====
symbol: "XBTUSDTM"
timeframe: "5m"
check_interval: 10
leverage: 10

# ===== Risk Management - TIGHTER to stop losses =====
max_position_size: 10        # reduced from $15 to $10
risk_per_trade: 1.0          # reduced from 1.5% to 1.0%
stop_loss_percent: 0.2       # TIGHTER: 0.2% stop loss (was 0.3%)
take_profit_percent: 0.6     # BIGGER target: 0.6% (was 0.5%) = 3:1 RR
trailing_stop: true
trailing_stop_distance: 0.15
max_daily_loss: 3.0          # tighter: stop at 3% daily loss ($1.50)
max_drawdown: 8.0

# ===== Strategy - Higher Quality Signals Only =====
ema_fast: 7
ema_slow: 15
ema_signal_threshold: 0.15
min_signal_strength: 5       # raised from 4 to 5 - better quality
rsi_period: 14
rsi_overbought: 60
rsi_oversold: 40
rsi_extreme_overbought: 75
rsi_extreme_oversold: 25

# ===== Filters =====
confirm_with_higher_tf: true  # RE-ENABLE - reduces bad trades
volume_threshold: 1.3
exit_on_opposite_signal: true
max_hold_time_minutes: 15    # shorter: 15min max hold for scalping

# ===== Multi-Pair Trading - ENABLED =====
multi_pair_trading:
  enabled: true
  pairs:
    - "XBTUSDTM"       # Bitcoin - liquid, reliable
    - "SIRENUSDTM"     # SIREN - small cap, more volatile = more signals

# ===== Self-Learning =====
learning_enabled: true
optimization_interval: 20
min_trades_for_optimization: 10
parameter_auto_tune: true
performance_tracking: true

# ===== ML =====
ml_enabled: true
ml_model_type: "random_forest"
ml_feature_count: 10
ml_retrain_interval: 20
ml_confidence_threshold: 0.55

# ===== Market Regime =====
regime_detection: true
volatility_lookback: 30
trend_strength_threshold: 0.4

# ===== Logging =====
log_level: "INFO"
log_file: "trading_bot.log"
log_trades_to_file: true
performance_report_interval: 900

# ===== Database =====
journal_db_path: "trading_journal.db"
